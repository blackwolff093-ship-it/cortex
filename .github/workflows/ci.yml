name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    name: Typecheck and build
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The native modules (better-sqlite3, node-llama-cpp) are only needed to
      # RUN the app, not to typecheck or build it, so CI skips their download.
      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build renderer and main
        run: npm run build
